<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPVision hybrid</title>
<style>
:root{--bg:#0B0E14;--p:#121722;--p2:#151B27;--b:#263042;--b2:#1C2331;--t:#E8ECF4;--m:#A3ADBF;--d:#7D889C;--mono:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;--dw:380px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
.cap{font:600 10.5px/1.2 var(--mono);letter-spacing:.07em;color:var(--d);text-transform:uppercase}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--b);background:#0F131C}
.logo{font:700 18px/1 var(--mono)}.logo span{color:#6CA8FF}
.task{flex:1 1 300px;display:flex;align-items:center;gap:10px;min-width:0;background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:0 12px;height:38px}
.task input{flex:1;min-width:0;background:transparent;border:0;color:var(--t);font:14px inherit;outline:none}
.seg{display:flex;border:1px solid var(--b);border-radius:8px;overflow:hidden}
.seg button{height:34px;padding:0 12px;border:0;cursor:pointer;background:var(--p);color:var(--m)}
.seg button.on{background:var(--b);color:var(--t)}
.primary{height:38px;padding:0 16px;border-radius:8px;border:0;background:#6CA8FF;color:#0B0E14;font-weight:600;cursor:pointer}
.tog{height:34px;padding:0 12px;border-radius:8px;cursor:pointer;border:1px solid var(--b);background:var(--p);color:var(--m)}
.tog.on{border-color:#FFB454;background:rgba(255,180,84,.12);color:#FFD49A}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;border-bottom:1px solid var(--b2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--m);margin-left:auto}
.legend svg{vertical-align:middle;margin-right:5px}
main{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 0px;gap:0;transition:grid-template-columns .22s ease}
main.open{grid-template-columns:270px minmax(0,1fr) var(--dw)}
#script{border-right:1px solid var(--b2);overflow:auto;padding:12px 0}
.hdr{padding:12px 14px 4px;font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--d)}
.line{display:flex;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;padding:3px 14px;font:12px/1.65 var(--mono);background:transparent;transition:background .2s}
.line:hover{background:rgba(255,255,255,.03)}
.line.path{background:rgba(108,168,255,.06)}
.line.hot{background:rgba(108,168,255,.18);box-shadow:inset 3px 0 0 #6CA8FF}
.line.dim{opacity:.35}
.line.flash{animation:fl 1s ease 2}
@keyframes fl{50%{background:rgba(108,168,255,.45)}}
.line .n{width:18px;flex:none;color:#5E687B;text-align:right}
.line .c{white-space:pre;overflow:hidden;text-overflow:ellipsis}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0}
#scroller{flex:1;min-height:0;overflow:auto;padding:10px 12px}
#fit{position:relative}
#c{position:absolute;left:0;top:0;transform-origin:0 0}
.lane{position:absolute;left:0;border-top:1px solid #1C2331}
.lname{position:absolute;left:10px;top:14px;width:108px}
.lname b{display:block;font:600 11px/1.3 var(--mono);letter-spacing:.06em}
.lname span{font-size:11px;line-height:1.3;color:var(--d)}
.node{position:absolute;padding:6px 9px;border-radius:9px;background:#151B27;text-align:left;cursor:pointer;color:var(--t);box-shadow:0 3px 10px rgba(0,0,0,.35);transition:opacity .25s,box-shadow .2s}
.node:hover{box-shadow:0 0 0 2px rgba(108,168,255,.35),0 3px 10px rgba(0,0,0,.35)}
.node .k{display:block;font:600 9px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.node .ti{display:block;margin-top:2px;font:600 11.5px/1.25 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .su{display:block;font-size:10.5px;line-height:1.25;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;padding:1px 7px;border-radius:999px;font:600 10px/1.5 var(--mono);background:#0B0E14;border:1px solid #263042;pointer-events:none;transition:opacity .2s}
.replay{border-top:1px solid var(--b2);padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sq{width:34px;height:30px;border-radius:6px;border:1px solid var(--b);background:var(--p2);cursor:pointer}
.ticks{display:flex;gap:4px;flex:1 1 160px}
.ticks button{flex:1;height:26px;border-radius:4px;cursor:pointer;border:1px solid var(--b);background:var(--p2)}
.srow{display:flex;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;padding:3px 8px;border-radius:6px;font:12.5px/1.7 var(--mono);background:transparent}
.srow:hover{background:rgba(255,255,255,.03)}
#drawer{overflow:hidden;border-left:1px solid var(--b2);background:var(--p)}
#dIn{width:var(--dw);height:100%;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dh h2{margin:4px 0 2px;font:600 16px/1.3 var(--mono);word-break:break-word}
.dh .sub{font-size:12.5px;color:var(--m)}
.x{width:30px;height:30px;flex:none;border-radius:6px;border:1px solid var(--b);background:var(--p2);cursor:pointer;font-size:18px;line-height:1;color:var(--m)}
.why{margin:0;font-size:13px;line-height:1.55;color:#C7CFDC}
.block{border:1px solid #FF5C5C;background:#2A1417;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:6px}
.arg{background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.arg code{font:12px var(--mono)}
.arg .val{color:#FFD49A}
.from{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--m);font-size:12px}
.chip{border:1px solid var(--b);background:var(--bg);border-radius:999px;padding:1px 8px;font:600 11px/1.6 var(--mono);cursor:pointer}
.chip:hover{background:var(--b2)}
.pol{border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5}
.pol.ok{background:rgba(91,211,138,.08);border:1px solid rgba(91,211,138,.3)}
.pol.ok b{color:#5BD38A}
.pol.bad{background:#2A1417;border:1px solid #FF5C5C}
.pol.bad b{color:#FF8A8A}
dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:13px}
dt{font:600 10px/1.4 var(--mono);letter-spacing:.06em;color:var(--d)}dd{margin:2px 0 0}
pre{margin:0;padding:10px;background:var(--bg);border:1px solid var(--b2);border-radius:8px;font:11.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
mark.u{background:rgba(255,122,182,.18);color:#FF9CCB;border-radius:3px;padding:0 2px}
.saw{width:100%;border-collapse:collapse;font-size:12.5px}
.saw td{padding:4px 0;border-bottom:1px solid var(--b2)}
.saw td:last-child{text-align:right;font-family:var(--mono)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:600 17px var(--mono)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--b);background:var(--p2);cursor:pointer;font-size:12.5px}
.acts button:hover{border-color:#6CA8FF}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 16px;border-top:1px solid var(--b2);font-size:12.5px;color:var(--m)}
footer b{color:var(--t);font-family:var(--mono)}
.hint{font-size:12.5px;color:var(--m)}.hint b{color:var(--t)}
@media (max-width:900px){body{overflow:auto;height:auto}main,main.open{display:flex;flex-direction:column}#script{max-height:220px;border-right:0;border-bottom:1px solid var(--b2)}#drawer{border-left:0;border-top:1px solid var(--b2)}#dIn{width:100%}main:not(.open) #drawer{display:none}#scroller{min-height:420px}}
</style>
</head>

const S={sel:q.get('sel'),mode:q.get('mode')||'lineage',view:q.get('view')||'graph',ctx:q.get('ctx')!=='off',step:+(q.get('step')||9)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function walk(id,down,acc=new Set()){E.forEach(e=>{const nx=down?(e.a===id?e.b:null):(e.b===id?e.a:null);if(nx&&!acc.has(nx)){acc.add(nx);walk(nx,down,acc)}});return acc}
function litSet(){if(!S.sel)return null;const s=new Set([S.sel,...walk(S.sel,1)]);if(S.mode==='lineage')walk(S.sel,0).forEach(x=>s.add(x));return s}
function geom(e){const a=byId[e.a],b=byId[e.b],o=e.o||{};let d,lx,ly;
 if(o.side){const ax=a.x+W,ay=a.y+o.side,bx=b.x+W/2,by=b.y+NH+4,r=10;d=`M${ax} ${ay} H${bx-r} Q${bx} ${ay} ${bx} ${ay-r} V${by}`;lx=(ax+bx)/2;ly=ay}
 else if(a.lane===b.lane){if(o.arc){const ax=a.x+W/2,bx=b.x+o.bx,yy=a.y+NH,yb=yy+o.arc*1.33;d=`M${ax} ${yy} C ${ax} ${yb}, ${bx} ${yb}, ${bx} ${yy+4}`;lx=(ax+bx)/2;ly=yy+o.arc}else{const y=a.y+NH/2;d=`M${a.x+W} ${y} L${b.x-4} ${y}`;lx=(a.x+W+b.x)/2;ly=y-12}}
 else{const down=b.y>a.y,ax=a.x+W/2,ay=down?a.y+NH:a.y,bx=b.x+W/2,by=down?b.y-4:b.y+NH+4;if(Math.abs(ax-bx)<2){d=`M${ax} ${ay} L${bx} ${by}`;lx=ax;ly=(ay+by)/2}else{const my=(ay+by)/2;d=`M${ax} ${ay} C ${ax} ${my}, ${bx} ${my}, ${bx} ${by}`;lx=(ax+bx)/2;ly=my}}
 return {d,lx,ly}}
function graph(lit){
 const vis=n=>n.t<=S.step;let h='';
 LANES.forEach((l,i)=>{const y=LT+i*LH,ctx=S.ctx&&l[0]==='model';h+=`<div class="lane" style="top:${y}px;width:${CW}px;height:${LH}px;background:${ctx?'rgba(255,180,84,.07)':(i%2?'rgba(255,255,255,.012)':'transparent')}"><div class="lname"><b style="color:${l[3]}">${l[1]}</b><span>${l[2]}</span></div></div>`});
 h+=`<div class="lane" style="top:${LT+6*LH}px;width:${CW}px;height:1px"></div>`;
 h+=`<div style="position:absolute;left:575px;top:8px;height:${6*LH+40}px;border-left:1px dashed #3A4458"></div><div class="cap" style="position:absolute;left:130px;top:14px">Round 1</div><div class="cap" style="position:absolute;left:592px;top:14px">Round 2 · after the model read #42</div>`;
 if(S.ctx){const yb=LT+2*LH;h+=`<div style="position:absolute;left:0;top:${yb}px;width:${CW}px;border-top:1.5px dashed rgba(255,180,84,.6)"></div><div style="position:absolute;left:1170px;top:${LT+LH+12}px;width:160px;text-align:right"><div class="cap" style="color:#FFB454">Model context</div><div style="font:600 15px var(--mono)">920 tok</div><div style="font-size:11px;color:var(--d)">all the model ever saw</div></div><div class="cap" style="position:absolute;left:1030px;top:${yb+6}px;width:300px;text-align:right;color:#8FA3BF">↓ Sandbox · 15,060 tok the model never saw</div>`}
 let svg=`<svg width="${CW}" height="${CH}" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" aria-hidden="true"><defs>`,paths='',labels='';
 E.forEach((e,i)=>{const {d,lx,ly}=geom(e),st=COL[e.t],shown=vis(byId[e.a])&&vis(byId[e.b]),on=!lit||(lit.has(e.a)&&lit.has(e.b));
  const op=!shown?.04:(on?1:.12),path=lit&&on,txt=path?e.v:e.l;
  svg+=`<marker id="a${i}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${st}"/></marker>`;
  paths+=`<path d="${d}" fill="none" stroke="${st}" stroke-width="${path?2.6:(e.t==='block'||e.t==='taint'?2.2:1.8)}" stroke-dasharray="${e.t==='taint'?'6 4':(e.t==='block'?'3 3':'none')}" marker-end="url(#a${i})" opacity="${op}"/>`;
  labels+=`<span class="lbl" style="left:${lx}px;top:${ly}px;color:${e.t==='block'?'#0B0E14':(e.t==='write'?'#C7CFDC':st)};background:${e.t==='block'?'#FF5C5C':'#0B0E14'};border-color:${e.t==='block'?'#FF5C5C':(path?st:'#263042')};opacity:${op};${path?'font-size:11px;':''}">${esc(txt)}</span>`});
 h+=svg+'</defs>'+paths+'</svg>'+labels;
 N.forEach(n=>{const on=!lit||lit.has(n.id),blocked=n.status==='blocked',op=!vis(n)?.07:(on?1:.22);
  h+=`<button class="node" data-sel="${n.id}" aria-label="${esc(n.kind+': '+n.title)}" style="left:${n.x}px;top:${n.y}px;width:${W}px;height:${NH}px;border:1.5px solid ${n.col};${blocked?'background:#2A1417;':''}opacity:${op};${n.id===S.sel?'box-shadow:0 0 0 3px rgba(108,168,255,.65);':''}"><span class="k" style="color:${n.col}">${esc(n.kind)}</span><span class="ti">${esc(n.title)}</span><span class="su">${esc(n.sub)}</span></button>`});
 return `<div id="fit"><div id="c" style="width:${CW}px;height:${CH}px"><div class="cap" style="position:absolute;left:130px;top:${LT+6*LH+12}px;text-transform:none;letter-spacing:0;font:12px Inter,system-ui,sans-serif">Read <b style="color:var(--t)">top to bottom</b> for cause (you ask → the model writes code → the code calls MCP servers) and <b style="color:var(--t)">left to right</b> for time.</div>${h}</div></div>`}
function strace(){return STRACE.map(r=>`<button class="srow" data-sel="${r[4]}" style="opacity:${r[0]<=S.step?1:.25};background:${r[4]===S.sel?'rgba(108,168,255,.16)':''}"><span style="color:#5E687B;width:64px;flex:none">${r[1]}</span><span style="width:70px;flex:none;color:${r[2]==='BLOCK'?'#FF8A8A':(r[2]==='context'?'#FF9CCB':'#6CA8FF')}">${r[2]}</span><span style="white-space:pre-wrap">${esc(r[3])}</span></button>`).join('')+'<p style="margin:14px 8px 0;font-size:12.5px;color:var(--d)">The same run as a flat log. This is what you had before: correct, ordered, and blind to how the data connects.</p>'}
const chip=id=>`<button class="chip" data-sel="${id}" style="border-color:${byId[id].col};color:${byId[id].col}">${esc(byId[id].short)}</button>`;
const sec=(t,b)=>`<div class="sec"><div class="cap">${t}</div>${b}</div>`;
function drawer(n){
 const up=walk(n.id,0),down=walk(n.id,1);
 let h=`<div class="dh"><div><div class="cap" style="color:${n.col}">${esc(n.kind)}</div><h2>${esc(n.fn||n.title)}</h2><div class="sub">${esc(n.fn?n.title+' · '+n.sub:n.sub)}</div></div><button class="x" id="close" aria-label="Close details">×</button></div>`;
 if(n.status==='blocked')h+=`<div class="block"><div class="cap" style="color:#FF8A8A;margin-bottom:4px">Blocked before it ran</div>${esc(n.policy[1])}</div>`;
 h+=`<p class="why">${esc(n.why)}</p>`;
 if(n.type==='tool'){
  h+=sec('Arguments · where each came from',n.args.map(a=>`<div class="arg"><div><code>${a[0]}</code> = <code class="val">${esc(a[1])}</code></div><div class="from">← ${chip(a[2])}<span>${esc(a[3])}</span></div></div>`).join(''));
  if(n.status!=='blocked')h+=sec('Policy',`<div class="pol ok"><b>${n.policy[0]}.</b> ${esc(n.policy[1])}</div>`);
  h+=`<dl><div><dt>TRANSPORT</dt><dd>${n.transport}</dd></div><div><dt>TIMING</dt><dd>${n.timing}</dd></div><div style="grid-column:1/-1"><dt>RESULT</dt><dd>${esc(n.result)}</dd></div></dl>`;
  h+=sec('Raw MCP JSON-RPC',`<pre>${esc(n.rpc)}</pre>`);
 }else if(n.type==='model'){
  const tot=n.saw.reduce((s,r)=>s+r[1],0);
  h+=sec('Exactly what the model saw',`<table class="saw">${n.saw.map(r=>`<tr><td style="color:${r[2]?'#FF9CCB':'inherit'}">${r[2]?'⚠ ':''}${esc(r[0])}</td><td>${r[1]} tok</td></tr>`).join('')}<tr><td><b>Total in context</b></td><td><b>${tot} tok</b></td></tr></table>`);
  if(n.excerpt)h+=sec('Preview text · untrusted part highlighted',`<pre>${n.excerpt}</pre>`);
  if(n.wrote)h+=sec('Script it wrote',`<pre>${esc(n.wrote)}</pre>`);
 }else if(n.type==='script'){
  h+=sec('Code',`<pre>${esc(codeOf(n.lines))}</pre>`);
  if(n.reads.length)h+=sec('Values it read',n.reads.map(r=>`<div class="arg"><div><code>${r[0]}</code> = <code class="val">${esc(r[1])}</code></div><div class="from">← ${chip(r[2])}</div></div>`).join(''));
  if(n.makes.length)h+=sec('Values it made',n.makes.map(r=>`<div class="arg"><div><code>${r[0]}</code> = <code class="val">${esc(r[1])}</code></div><div class="from"><span style="color:${r[2]==='private'?'#FFB454':'var(--m)'}">${r[2]}${r[2]==='private'?' · stays in sandbox':''}</span></div></div>`).join(''));
  if(n.calls.length)h+=sec('Calls it made',`<div class="from">${n.calls.map(chip).join('')}</div>`);
  if(n.cause)h+=sec('Why this line exists',`<div class="from">written by ${chip(n.cause)}<span>after reading #42</span></div>`);
 }else{
  h+=sec('You typed',`<pre>${esc(n.text)}</pre>`);
  h+=`<dl><div><dt>TRUST</dt><dd>Trusted</dd></div><div><dt>SIZE</dt><dd>96 tok</dd></div></dl>`;
 }
 h+=`<div class="stats"><div class="stat"><span class="cap">Came from</span><b>${up.size}</b><span style="font-size:12px;color:var(--m)">upstream nodes</span></div><div class="stat"><span class="cap">Touched</span><b>${down.size}</b><span style="font-size:12px;color:var(--m)">downstream nodes</span></div></div>`;
 h+=`<div class="acts"><button data-act="lineage">Trace back</button><button data-act="blast">Blast radius</button>${n.lines.length?`<button data-act="line">Jump to line ${n.lines[0]}</button>`:''}<button data-act="replay">Replay to here</button></div>`;
 return h}
function render(){
 const lit=litSet(),n=S.sel&&byId[S.sel];
 vG.className=S.view==='graph'?'on':'';vS.className=S.view==='strace'?'on':'';
 mL.className=S.mode==='lineage'?'on':'';mB.className=S.mode==='blast'?'on':'';
 ctx.className='tog'+(S.ctx?' on':'');ctx.textContent='Context boundary: '+(S.ctx?'on':'off');
 hint.innerHTML=n?`Tracing <b>${esc(n.short)}</b> · ${S.mode==='lineage'?'where it came from and where it went':'everything it touched'}`:'<b>Click any box</b> or script line to trace it';
 const hot=new Set(n?n.lines:[]),pathL=new Set();if(lit)lit.forEach(id=>{if(byId[id].type==='script')byId[id].lines.forEach(l=>pathL.add(l))});
 script.innerHTML='<div class="cap" style="padding:0 14px 6px">Script · written by Gemini</div>'+LINES.map(l=>{if(l.h)return `<div class="hdr">${l.h}</div>`;const cls=hot.has(l.n)?' hot':(pathL.has(l.n)?' path':(lit?' dim':''));return `<button class="line${cls}" id="L${l.n}" data-sel="${l.node}" style="color:${l.n===9?'#FF9CCB':'#E8ECF4'}"><span class="n">${l.n}</span><span class="c">${esc(l.c)}</span></button>`}).join('');
 scroller.innerHTML=S.view==='graph'?graph(lit):strace();
 ticks.innerHTML=[1,2,3,4,5,6,7,8,9].map(k=>{const c=k===9?'#FF5C5C':(k===4?'#FF7AB6':'#6CA8FF');return `<button data-step="${k}" title="${k}. ${STEP[k]}" aria-label="Step ${k}: ${STEP[k]}" style="border-color:${k===9||k===4?c:'#263042'};background:${k<=S.step?c:'#151B27'};${n&&n.t===k?'outline:2px solid #E8ECF4;outline-offset:1px;':''}"></button>`}).join('');
 steplbl.textContent=`step ${S.step}/9 · ${STEP[S.step]}`;
 main.classList.toggle('open',!!n);
 if(n)dIn.innerHTML=drawer(n);
 fit();
}
function fit(){const f=document.getElementById('fit'),c=document.getElementById('c');if(!f)return;const k=Math.max(.72,Math.min(1,(scroller.clientWidth-24)/CW));c.style.transform=`scale(${k})`;f.style.width=CW*k+'px';f.style.height=CH*k+'px';
 const n=S.sel&&byId[S.sel];if(n){const x0=n.x*k,x1=(n.x+W)*k,vl=scroller.scrollLeft,vw=scroller.clientWidth-24;if(x1>vl+vw)scroller.scrollLeft=x1-vw+40;else if(x0<vl)scroller.scrollLeft=Math.max(0,x0-40)}}
new ResizeObserver(fit).observe(scroller);
function set(k,v){S[k]=v;render()}
let timer;function play(to){clearInterval(timer);S.step=1;render();timer=setInterval(()=>{if(S.step>=to)return clearInterval(timer);set('step',S.step+1)},600)}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-sel],[data-step],[data-act],#close');
 if(!t){if(ev.target.closest('#scroller'))set('sel',null);return}
 if(t.id==='close')return set('sel',null);
 if(t.dataset.sel)return set('sel',t.dataset.sel===S.sel&&t.classList.contains('node')?null:t.dataset.sel);
 if(t.dataset.step){clearInterval(timer);return set('step',+t.dataset.step)}
 const a=t.dataset.act,n=byId[S.sel];
 if(a==='lineage'||a==='blast')return set('mode',a);
 if(a==='replay')return play(n.t);
 if(a==='line'){const el=document.getElementById('L'+n.lines[0]);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});n.lines.forEach(l=>{const e=document.getElementById('L'+l);e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')})}}
});
vG.onclick=()=>set('view','graph');vS.onclick=()=>set('view','strace');mL.onclick=()=>set('mode','lineage');mB.onclick=()=>set('mode','blast');ctx.onclick=()=>set('ctx',!S.ctx);
back.onclick=()=>{clearInterval(timer);set('step',Math.max(1,S.step-1))};fwd.onclick=()=>{clearInterval(timer);set('step',Math.min(9,S.step+1))};run.onclick=()=>play(9);
document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(ev.key==='Escape')set('sel',null);if(ev.key==='ArrowRight')fwd.onclick();if(ev.key==='ArrowLeft')back.onclick()});
main.addEventListener('transitionend',fit);
render();
</script>
</body>
</html>
